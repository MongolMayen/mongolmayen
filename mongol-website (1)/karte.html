<script>
(function () {
  var ADRESSE = "Am Wasserturm 6 · 56727 Mayen";
  var TELEFON = "02651 / 703 55 96";
  var ZEITEN  = "Geöffnet Montag und Mittwoch bis Sonntag, 11:30–15:00 Uhr und 17:30–23:00 Uhr. Dienstag Ruhetag.";

  function decode(s) { var t = document.createElement("textarea"); t.innerHTML = s; return t.value; }
  function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  /* ---------- Daten einlesen ---------- */
  function parsePrices(s) {
    if (!s) return [];
    s = s.replace(/[\[\]]/g, "");
    return s.split(";").map(function (part) {
      part = part.trim();
      if (!part) return null;
      var label = "", val = part;
      var i = part.indexOf("=");
      if (i > -1) { label = part.slice(0, i).trim(); val = part.slice(i + 1).trim(); }
      if (/^\d+([.,]\d+)?$/.test(val)) val = val + " €";
      return { label: label, val: val };
    }).filter(Boolean);
  }

  function parse(raw) {
    var tabs = [], tab = null, sub = null;
    raw.split("\n").forEach(function (line) {
      line = line.trim();
      if (!line || line.indexOf("//") === 0) return;
      var p;
      if (line.indexOf("##") === 0) {
        p = line.slice(2).split("|").map(function (x) { return decode(x.trim()); });
        if (!tab) { tab = { title: "", subs: [] }; tabs.push(tab); }
        sub = { title: p[0], note: p[1] || "", items: [] };
        tab.subs.push(sub);
        return;
      }
      if (line.charAt(0) === "#") {
        p = line.slice(1).split("|").map(function (x) { return decode(x.trim()); });
        tab = { title: p[0], subs: [] };
        tabs.push(tab);
        sub = null;
        return;
      }
      if (!tab) { tab = { title: "Karte", subs: [] }; tabs.push(tab); }
      if (!sub) { sub = { title: "", note: "", items: [] }; tab.subs.push(sub); }
      var f = line.split("|").map(function (x) { return decode(x.trim()); });
      sub.items.push({
        nr: f[0] || "", name: f[1] || "", info: f[2] || "",
        text: f[3] || "", prices: parsePrices(f[4] || ""), notes: f[5] || ""
      });
    });
    return tabs;
  }

  var tabs = parse(document.getElementById("karte").textContent);

  /* ---------- Anzeige ---------- */
  var out = document.getElementById("out");
  var chips = document.getElementById("chips");
  var observer = null;

  function itemHay(it) { return norm(it.name + " " + it.info + " " + it.text); }

  function renderItem(it) {
    var row = el("div", "item");
    row.appendChild(el("div", "nr", it.nr));
    var mc = el("div", "main-col");
    var tr = el("div", "title-row");
    var nm = el("span", "name", it.name);
    if (it.notes) nm.appendChild(el("sup", "z", it.notes));
    tr.appendChild(nm);
    if (it.info) tr.appendChild(el("span", "info", it.info));
    mc.appendChild(tr);
    if (it.text) {
      var parts = it.text.split("·");
      if (parts.length > 1) {
        mc.appendChild(el("div", "origin", parts[0].trim()));
        mc.appendChild(el("div", "desc", parts.slice(1).join("·").trim()));
      } else {
        mc.appendChild(el("div", "desc", it.text));
      }
    }
    row.appendChild(mc);
    var pr = el("div", "prices");
    it.prices.forEach(function (p) {
      var d = el("div", "p");
      if (p.label) d.appendChild(el("span", "lbl", p.label));
      d.appendChild(el("span", "val", p.val));
      pr.appendChild(d);
    });
    row.appendChild(pr);
    return row;
  }

  function render(query) {
    var q = norm(query.trim());
    out.textContent = "";
    chips.textContent = "";
    if (observer) observer.disconnect();
    var shownTabs = [];

    tabs.forEach(function (t, ti) {
      var sec = el("section", "tab");
      sec.id = "t" + ti;
      sec.appendChild(el("h2", "script", t.title));
      var any = false;
      t.subs.forEach(function (s) {
        var titleHit = q && (norm(s.title).indexOf(q) > -1 || norm(t.title).indexOf(q) > -1);
        var items = s.items.filter(function (it) { return !q || titleHit || itemHay(it).indexOf(q) > -1; });
        if (!items.length) return;
        any = true;
        var box = el("div", "sub");
        if (s.title || s.note) {
          var head = el("div", "sub-head");
          head.appendChild(el("h3", "script", s.title));
          if (s.note) head.appendChild(el("span", "note", s.note));
          box.appendChild(head);
        }
        items.forEach(function (it) { box.appendChild(renderItem(it)); });
        sec.appendChild(box);
      });
      if (any) { out.appendChild(sec); shownTabs.push({ id: sec.id, title: t.title }); }
    });

    if (!shownTabs.length) {
      out.appendChild(el("p", "empty", "Dazu haben wir nichts gefunden. Probieren Sie einen anderen Suchbegriff."));
    }

    shownTabs.forEach(function (t) {
      var a = el("a", "chip", t.title);
      a.href = "#" + t.id;
      a.dataset.target = t.id;
      chips.appendChild(a);
    });

    if (!("IntersectionObserver" in window)) return;
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        chips.querySelectorAll(".chip").forEach(function (c) {
          var on = c.dataset.target === en.target.id;
          c.classList.toggle("on", on);
          if (on) {
            var left = c.offsetLeft - chips.clientWidth / 2 + c.clientWidth / 2;
            chips.scrollTo({ left: left, behavior: "smooth" });
          }
        });
      });
    }, { rootMargin: "-25% 0px -65% 0px" });
    document.querySelectorAll("main section.tab").forEach(function (s) { observer.observe(s); });
  }

  /* ---------- Fußzeile ---------- */
  var ad = document.getElementById("adresse");
  ad.appendChild(document.createTextNode(ADRESSE + " · Telefon "));
  var tel = el("a", null, TELEFON);
  tel.href = "tel:" + TELEFON.replace(/[^\d+]/g, "");
  ad.appendChild(tel);
  document.getElementById("zeiten").textContent = ZEITEN;

  var leg = document.getElementById("legend");
  var legParts = document.getElementById("hinweise").textContent.split("\n").map(function (l) {
    l = l.trim(); if (!l) return "";
    var i = l.indexOf("="); return l.slice(0, i).trim() + ") " + l.slice(i + 1).trim();
  }).filter(Boolean);
  leg.textContent = "Kennzeichnung: " + legParts.join(" · ");

  /* ---------- Suche & Theme ---------- */
  var qi = document.getElementById("q");
  qi.addEventListener("input", function () { render(qi.value); });

  document.getElementById("themeBtn").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });

  render("");

  // Nach-oben-Knopf ein-/ausblenden
  var topFab = document.getElementById("topFab");
  window.addEventListener("scroll", function () {
    topFab.classList.toggle("show", window.scrollY > 500);
  });
})();
</script>
</body>
</html>
